<div class="main">
<h1>Login Page</h1>
<form (submit)="userLogin($event)">
    Username : <input type="text" name="uname"><br><br>
    Password : <input type="password" name="pwd"><br><br>
    Role : <select><br><br>
        <option>Admin</option>
        <option>Staff</option>
        <option>Student</option>
    </select>
    <br><br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button><br>
</form>
</div>
