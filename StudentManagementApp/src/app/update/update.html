<app-menu></app-menu>
<div class="main">    
    <form (submit)="updateStudent($event)">
    <h1>Enter Roll no to update</h1>
    <input type="number" name="rollno" placeholder="Enter roll No"><br><br>

    <h3>Enter the student Details </h3>

        Enter RegNo : <input type="number" name="regno"><br><br>
        Enter Name : <input type="text" name="studentname"><br><br>
        Enter Standard : <input type="number" name="standard"><br><br>
        Enter School : <input type="text" name="school"><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</div>
